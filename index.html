<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Legacy of Four">
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<title>Legacy of Four</title>
<style>html,body{background:#0b0b14;margin:0}</style>
</head>
<body>
<div id="stage">
  <header id="title">
    <h1>LEGACY <span>OF</span> FOUR</h1>
    <div class="bar"><i></i><i></i><i></i><i></i></div>
  </header>
  <div id="screen"><canvas id="game"></canvas><button id="fs" aria-label="Fullscreen">&#x26F6;</button></div>
</div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <button id="btnAtk"><b>ATTACK</b></button>
    <button id="btnJump"><b>JUMP</b></button>
    <button id="btnSp"><b>SPECIAL</b></button>
  </div>
</div>
<script>
// Bootstrap anti-cache: baca assets/build.json (tanpa cache) lalu muat CSS/JS/gambar dengan ?v=<build>.
(function () {
  function boot(b, mods) {
    window.__BUILD = b || ''; var q = b ? '?v=' + encodeURIComponent(b) : '';
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'styles/game.css' + q; document.head.appendChild(l);
    if (b && mods && mods.length && window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')) {
      var im = { imports: {} }; mods.forEach(function (m) { im.imports['./' + m] = './' + m + q; });
      var s = document.createElement('script'); s.type = 'importmap'; s.textContent = JSON.stringify(im); document.head.appendChild(s);
    }
    import('./src/main.js' + q).catch(function (e) { document.body.insertAdjacentHTML('beforeend', '<pre style="color:#f88;padding:12px">Gagal memuat game: ' + e + '</pre>'); });
  }
  fetch('assets/build.json', { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (j) { boot(j.build, j.modules); }, function () { boot('', []); });
})();
</script>
</body>
</html>
